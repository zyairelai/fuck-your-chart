services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: fuck-your-chart
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
    volumes:
      # Persist custom price levels across container restarts
      - custom-levels-data:/app/data
    restart: unless-stopped

volumes:
  custom-levels-data:
